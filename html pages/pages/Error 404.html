<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>About Us Section</title>
        <!-- Bootstrap 5 CSS CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
        <!-- Bootstrap Icons CDN -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
        <!-- External CSS -->
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- ========== error-404-section start ========== -->
        <section class="error-section">
            <div class="container px-4 text-center">
                <!-- Illustration Image -->
                <div class="mb-4">
                    <img
                        src="path-to-your-images/404-illustration.png"
                        alt="404 Page Not Found"
                        class="img-fluid error-img"
                        [cite: 6]
                    />
                </div>

                <!-- Error Title & Subtitle -->
                <div class="mb-4">
                    <h2 class="error-title mb-2">404 – Page Not Found</h2>
                    <p class="error-subtitle mb-0">Looks like, page doesn't exist</p>
                </div>

                <!-- Back to Homepage Button -->
                <div>
                    <a href="#" class="btn btn-back-home text-decoration-none">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="16"
                            height="16"
                            fill="currentColor"
                            class="bi bi-arrow-left"
                            viewBox="0 0 16 16"
                        >
                            <path
                                fill-rule="evenodd"
                                d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"
                            />
                        </svg>
                        Back to Homepage
                    </a>
                </div>
            </div>
        </section>
        <!-- ========== error-404-section end ========== -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
