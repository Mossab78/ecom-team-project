<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>About Us Section</title>
        <!-- Bootstrap 5 CSS CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
        <!-- Bootstrap Icons CDN -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
        <!-- External CSS -->
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- ========== member-login-section start ========== -->
        <section class="py-5 bg-white">
            <div class="container px-4">
                <div class="row justify-content-center">
                    <div class="col-lg-6 col-md-8">
                        <!-- Header -->
                        <div class="mb-4">
                            <h2 class="login-section-title mb-1">Member Login</h2>
                            <p class="text-muted small mb-0">Welcome back!</p>
                        </div>

                        <form>
                            <!-- Email / Phone / Username -->
                            <div class="mb-3">
                                <label class="form-label login-form-label">Email / Phone / Username *</label>
                                <input
                                    type="text"
                                    class="form-control login-form-control"
                                    placeholder="stevenjob@gmail.com"
                                />
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label class="form-label login-form-label">Password *</label>
                                <input
                                    type="password"
                                    class="form-control login-form-control"
                                    placeholder="******************"
                                />
                            </div>

                            <!-- Remember me & Forgot Password -->
                            <div class="mb-4 d-flex justify-content-between align-items-center">
                                <div class="form-check mb-0">
                                    <input type="checkbox" class="form-check-input" id="rememberMeCheck" />
                                    <label class="form-check-label text-muted small" for="rememberMeCheck">
                                        Remember me
                                    </label>
                                </div>
                                <a href="#" class="text-decoration-none small text-muted">Forgot your password?</a>
                            </div>

                            <!-- Submit Button -->
                            <div class="mb-3">
                                <button type="submit" class="btn btn-login-submit w-100">Sign Up</button>
                            </div>

                            <!-- Sign Up Link -->
                            <p class="text-muted small mb-0">
                                Have not an account?
                                <a href="#" class="text-decoration-none fw-semibold text-primary">Sign Up</a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </section>
        <!-- ========== member-login-section end ========== -->

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
