<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>About Us Section</title>
        <!-- Bootstrap 5 CSS CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
        <!-- Bootstrap Icons CDN -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
        <!-- External CSS -->
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- ========== create-account-section start ========== -->
        <section class="py-5 bg-white">
            <div class="container px-4">
                <div class="row g-5 align-items-start">
                    <!-- Left Column: Registration Form -->
                    <div class="col-lg-7">
                        <div class="mb-4">
                            <h2 class="auth-section-title mb-1">Create an account</h2>
                            <p class="text-muted small mb-0">Access to all features. No credit card required.</p>
                        </div>

                        <form>
                            <!-- Full Name -->
                            <div class="mb-3">
                                <label class="form-label auth-form-label">Full Name *</label>
                                <input type="text" class="form-control auth-form-control" placeholder="Steven job" />
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label class="form-label auth-form-label">Email *</label>
                                <input
                                    type="email"
                                    class="form-control auth-form-control"
                                    placeholder="stevenjob@gmail.com"
                                />
                            </div>

                            <!-- Username -->
                            <div class="mb-3">
                                <label class="form-label auth-form-label">Username *</label>
                                <input type="text" class="form-control auth-form-control" placeholder="stevenjob" />
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label class="form-label auth-form-label">Password *</label>
                                <input
                                    type="password"
                                    class="form-control auth-form-control"
                                    placeholder="******************"
                                />
                            </div>

                            <!-- Re-Password -->
                            <div class="mb-3">
                                <label class="form-label auth-form-label">Re-Password *</label>
                                <input
                                    type="password"
                                    class="form-control auth-form-control"
                                    placeholder="******************"
                                />
                            </div>

                            <!-- Terms Checkbox -->
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="termsCheck" />
                                <label class="form-check-label text-muted small" for="termsCheck">
                                    By clicking Register button, you agree our terms and policy,
                                </label>
                            </div>

                            <!-- Submit Button -->
                            <div class="mb-3">
                                <button type="submit" class="btn btn-auth-submit w-100">Sign Up</button>
                            </div>

                            <!-- Login Link -->
                            <p class="text-muted small mb-0">
                                Already have an account?
                                <a href="#" class="text-decoration-none fw-semibold text-primary">Sign In</a>
                            </p>
                        </form>
                    </div>

                    <!-- Right Column: Social Network Account -->
                    <div class="col-lg-5 pt-lg-5 mt-lg-4">
                        <h5 class="text-center fw-bold mb-4">Use Social Network Account</h5>

                        <div class="d-grid gap-3 mb-4">
                            <!-- Google Sign Up -->
                            <button class="btn btn-social-auth d-flex align-items-center justify-content-center gap-2">
                                <span>Sign up with</span>
                                <img src="path-to-your-images/google-logo.png" alt="Google" height="18" />
                            </button>

                            <!-- Facebook Sign Up -->
                            <button class="btn btn-social-auth d-flex align-items-center justify-content-center gap-2">
                                <span>Sign up with</span>
                                <span class="fw-bold text-primary">Facebook</span>
                            </button>

                            <!-- Amazon Sign Up -->
                            <button class="btn btn-social-auth d-flex align-items-center justify-content-center gap-2">
                                <span>Sign up with</span>
                                <img src="path-to-your-images/amazon-logo.png" alt="Amazon" height="16" />
                            </button>
                        </div>

                        <!-- Business Account Link -->
                        <p class="text-muted small text-center mb-0">
                            Buying for work?
                            <a href="#" class="text-decoration-none text-primary">Create a free business account</a>
                        </p>
                    </div>
                </div>
            </div>
        </section>
        <!-- ========== create-account-section end ========== -->

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
